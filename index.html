<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Inbox — VastMyWealth</title>
<style>
:root{
  --navy-1:#0A1730; --navy-2:#122a56; --panel:#152B54; --panel-border:rgba(212,165,74,.35);
  --gold:#D9A94E; --gold-deep:#B8863B; --text-onnavy:#EDF1FA; --text-onnavy-muted:#A9B8DA;
  --forest:#3FBE86; --rust:#E4776B;
}
*{box-sizing:border-box; margin:0; padding:0;}
html, body{ height:100%; overflow:hidden; }
body{ font-family:'IBM Plex Sans',sans-serif; background:linear-gradient(180deg, var(--navy-1), var(--navy-2)); color:var(--text-onnavy); }
.app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }
.view{ display:none; flex-direction:column; height:100%; }
.view.active{ display:flex; }

.list-header{ padding:16px; border-bottom:1px solid var(--panel-border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.list-header h2{ font-size:17px; }
.refresh-btn{ background:var(--gold); color:var(--navy-1); border:none; border-radius:8px; padding:9px 16px; font-weight:700; cursor:pointer; font-size:13px; }
.refresh-btn:hover{ filter:brightness(1.05); }
.thread-list{ overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; }
.thread-item{ padding:16px; border-bottom:1px solid rgba(255,255,255,.06); cursor:pointer; }
.thread-item:active{ background:rgba(217,169,78,.1); }

.tag-row{ display:flex; gap:6px; align-items:center; margin-top:6px; flex-wrap:wrap; }
.role-tag{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px; display:inline-block; }
.role-customer{ background:rgba(127,176,255,.15); color:#7FB0FF; }
.role-partner{ background:rgba(217,169,78,.15); color:var(--gold); }
.role-unknown{ background:rgba(255,255,255,.06); color:var(--text-onnavy-muted); }

.regstatus-tag{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px; }
.regstatus-registered{ background:rgba(63,190,134,.15); color:var(--forest); }
.regstatus-pending{ background:rgba(228,119,107,.15); color:var(--rust); }

.thread-mobile{ font-weight:700; font-size:15px; }
.thread-preview{ font-size:13px; color:var(--text-onnavy-muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.thread-dir-out{ color:var(--forest); }
.empty-msg{ padding:24px 16px; color:var(--text-onnavy-muted); font-size:14px; text-align:center; }

.thread-header{ padding:12px 16px; border-bottom:1px solid var(--panel-border); display:flex; align-items:center; gap:12px; flex-shrink:0; }
.back-btn{ background:none; border:none; color:var(--text-onnavy); font-size:22px; cursor:pointer; padding:4px 8px; line-height:1; }
.thread-header-info{ flex:1; }
.thread-header-mobile{ font-weight:700; font-size:15px; }
.call-btn{
  background: var(--forest);
  color: #fff;
  border-radius: 50%;
  width: 40px; height: 40px;
  display: flex; align-items:center; justify-content:center;
  font-size: 18px;
  text-decoration: none;
  flex-shrink: 0;
}
.call-btn:active{ filter:brightness(0.9); }
.window-badge{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; display:inline-block; margin-top:3px; }
.window-open{ background:rgba(63,190,134,.15); color:var(--forest); }
.window-closed{ background:rgba(228,119,107,.15); color:var(--rust); }

.messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
.msg{ max-width:80%; padding:10px 13px; border-radius:12px; font-size:14px; line-height:1.4; word-wrap:break-word; }
.msg-in{ align-self:flex-start; background:var(--panel); border:1px solid var(--panel-border); }
.msg-out{ align-self:flex-end; background:var(--gold); color:var(--navy-1); }
.msg-time{ font-size:10px; opacity:.65; margin-top:4px; }

.composer{ border-top:1px solid var(--panel-border); padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px; flex-shrink:0; }
.quick-replies{ display:flex; gap:8px; overflow-x:auto; margin-bottom:8px; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
.qr-btn{ background:rgba(255,255,255,.06); border:1px solid var(--panel-border); color:var(--text-onnavy-muted); border-radius:16px; padding:6px 12px; font-size:12px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
.qr-btn:active{ border-color:var(--gold); color:#fff; }
.composer-row{ display:flex; gap:8px; }
.composer-row textarea{ flex:1; border-radius:10px; border:1px solid var(--panel-border); background:rgba(255,255,255,.04); color:#fff; padding:10px; font-size:14px; resize:none; min-height:40px; max-height:100px; font-family:inherit; }
.send-btn{ background:var(--gold); color:var(--navy-1); border:none; border-radius:10px; padding:0 18px; font-weight:700; cursor:pointer; font-size:14px; }
.send-btn:disabled{ opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<div class="app">

  <div class="view active" id="listView">
    <div class="list-header">
      <h2>Conversations</h2>
      <button class="refresh-btn" onclick="loadThreads()">Refresh</button>
    </div>
    <div class="thread-list" id="threadList"><div class="empty-msg">Loading…</div></div>
  </div>

  <div class="view" id="threadView">
    <div class="thread-header">
      <button class="back-btn" onclick="showListView()">←</button>
      <div class="thread-header-info">
        <div class="thread-header-mobile" id="threadHeaderMobile"></div>
        <span class="window-badge" id="windowBadge"></span>
      </div>
      <a class="call-btn" id="callBtn" href="#" title="Call">📞</a>
    </div>
    <div class="messages" id="messagesPane"></div>
    <div class="composer">
      <div class="quick-replies" id="quickReplies"></div>
      <div class="composer-row">
        <textarea id="replyText" placeholder="Type a reply…"></textarea>
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </div>
  </div>

</div>

<script>
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbwGTSTzKTJYrhx2wP3UuBPG_64g-ZczNPhem3-PfcPPu8AYQaT0MvSgz1FsyRdoonVndg/exec";
var currentMobile = null;
var quickReplies = [];

function showListView(){
  document.getElementById('threadView').classList.remove('active');
  document.getElementById('listView').classList.add('active');
  currentMobile = null;
}

function showThreadView(){
  document.getElementById('listView').classList.remove('active');
  document.getElementById('threadView').classList.add('active');
}

function loadThreads(){
  document.getElementById('threadList').innerHTML = '<div class="empty-msg">Loading…</div>';
  fetch(BACKEND_URL + '?action=getManualInboxThreads')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data.success) { document.getElementById('threadList').innerHTML = '<div class="empty-msg">Error loading threads.</div>'; return; }
      renderThreads(data.threads);
    })
    .catch(function(){ document.getElementById('threadList').innerHTML = '<div class="empty-msg">Connection error.</div>'; });
}

function renderThreads(threads){
  var list = document.getElementById('threadList');
  if (!threads.length) { list.innerHTML = '<div class="empty-msg">No recent conversations.</div>'; return; }
  list.innerHTML = '';
  threads.forEach(function(t){
    var item = document.createElement('div');
    item.className = 'thread-item' + (t.hasLead ? ' converted' : '');
    var dirLabel = t.lastDirection === 'Out' ? '<span class="thread-dir-out">You: </span>' : '';
    var roleClass = t.role === 'Customer' ? 'role-customer' : (t.role === 'Partner' ? 'role-partner' : 'role-unknown');
    var displayName = t.name ? (escapeHtml(t.name) + ' — ' + escapeHtml(t.mobile)) : escapeHtml(t.mobile);

    // Registration status tag: "Registered" (from Accounts/Partners) vs
    // whatever raw status WA Leads has for them (e.g. "New").
    var regClass = t.status === 'Registered' ? 'regstatus-registered' : 'regstatus-pending';
    var statusHtml = t.status ? '<span class="regstatus-tag ' + regClass + '">' + escapeHtml(t.status) + '</span>' : '';

    var windowHtml = '<span class="window-badge ' + (t.windowOpen ? 'window-open' : 'window-closed') + '">' + (t.windowOpen ? 'Open' : 'Closed') + '</span>';

    item.innerHTML = '<div class="thread-mobile">' + displayName + '</div>' +
      '<div class="thread-preview">' + dirLabel + escapeHtml(t.lastMessage) + '</div>' +
      '<div class="tag-row">' +
        '<span class="role-tag ' + roleClass + '">' + escapeHtml(t.role) + (t.hasLead ? ' ✓ Form Filled' : '') + '</span>' +
        statusHtml + windowHtml +
      '</div>';
    item.onclick = function(){ openThread(t.mobile, t.name); };
    list.appendChild(item);
  });
}
function openThread(mobile, name){
  currentMobile = mobile;
  showThreadView();
  document.getElementById('threadHeaderMobile').textContent = name ? (name + ' (' + mobile + ')') : mobile;
  document.getElementById('callBtn').href = 'tel:+91' + mobile;
  document.getElementById('messagesPane').innerHTML = '<div class="empty-msg">Loading…</div>';
  Promise.all([
    fetch(BACKEND_URL + '?action=getManualInboxMessages&mobile=' + encodeURIComponent(mobile)).then(function(r){ return r.json(); }),
    fetch(BACKEND_URL + '?action=getQuickReplies').then(function(r){ return r.json(); })
  ]).then(function(results){
    var msgData = results[0], qrData = results[1];
    quickReplies = qrData.success ? qrData.replies : [];
    renderConversation(mobile, msgData);
  }).catch(function(){
    document.getElementById('messagesPane').innerHTML = '<div class="empty-msg">Connection error.</div>';
  });
}

function renderConversation(mobile, data){
  var badge = document.getElementById('windowBadge');
  if (data.windowOpen) {
    badge.textContent = 'Window open';
    badge.className = 'window-badge window-open';
  } else {
    badge.textContent = 'Window closed';
    badge.className = 'window-badge window-closed';
  }

  var pane = document.getElementById('messagesPane');
  pane.innerHTML = '';
  (data.messages || []).forEach(function(m){
    var div = document.createElement('div');
    div.className = 'msg ' + (m.direction === 'Out' ? 'msg-out' : 'msg-in');
    div.innerHTML = escapeHtml(m.message) + '<div class="msg-time">' + new Date(m.timestamp).toLocaleString() + '</div>';
    pane.appendChild(div);
  });
  pane.scrollTop = pane.scrollHeight;

  var qrContainer = document.getElementById('quickReplies');
  qrContainer.innerHTML = '';
  quickReplies.forEach(function(qr){
    var btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = qr.label;
    btn.onclick = function(){ document.getElementById('replyText').value = qr.message; };
    qrContainer.appendChild(btn);
  });

  var textEl = document.getElementById('replyText');
  var sendBtn = document.getElementById('sendBtn');
  textEl.disabled = !data.windowOpen;
  sendBtn.disabled = !data.windowOpen;
  textEl.placeholder = data.windowOpen ? 'Type a reply…' : 'Window closed — customer must message first';
}

document.getElementById('sendBtn').addEventListener('click', function(){
  if (!currentMobile) return;
  var textEl = document.getElementById('replyText');
  var message = textEl.value.trim();
  if (!message) return;
  var btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = '…';

  fetch(BACKEND_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'sendManualReply', mobile: currentMobile, message: message })
  })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.success) {
        textEl.value = '';
        openThread(currentMobile);
      } else {
        alert('Error: ' + (data.error || 'Unknown error'));
      }
      btn.disabled = false; btn.textContent = 'Send';
    })
    .catch(function(err){
      alert('Connection error: ' + err.message);
      btn.disabled = false; btn.textContent = 'Send';
    });
});

function escapeHtml(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

loadThreads();
</script>
</body>
</html>
